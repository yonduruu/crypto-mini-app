name: Auto Update

on:
  workflow_dispatch: # 외부 크론(cron-job.org) 및 깃허브 수동 실행 전용

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 코드를 푸시(업데이트)할 수 있도록 권한 부여
    
    steps:
    - name: 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 세팅하기
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests ccxt python-dotenv feedparser

    - name: 대시보드 데이터 갱신 및 텔레그램 알림 발송
      env:
        # 노꾸리 계정
        USER_A_EXCHANGE: okx
        USER_A_API_KEY: ${{ secrets.USER_A_API_KEY }}
        USER_A_SECRET: ${{ secrets.USER_A_SECRET }}
        USER_A_PASSPHRASE: ${{ secrets.USER_A_PASSPHRASE }}
        
        # 욘두루 계정
        USER_B_EXCHANGE: okx
        USER_B_API_KEY: ${{ secrets.USER_B_API_KEY }}
        USER_B_SECRET: ${{ secrets.USER_B_SECRET }}
        USER_B_PASSPHRASE: ${{ secrets.USER_B_PASSPHRASE }}
        
        # 깃허브 및 텔레그램 봇
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python fetch_both.py
        sleep 150
        python send_alert.py