name: 3Hour Auto Update

on:
  schedule:
    # 3시간마다 실행 (한국시간 오전 9시, 12시, 오후 3시, 6시, 9시, 자정, 새벽 3시, 6시)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 깃허브에서 수동 버튼으로 테스트할 수 있게 해줌

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    
    steps:
    - name: 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 세팅하기
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests ccxt python-dotenv feedparser

    - name: 대시보드 데이터 갱신 및 텔레그램 알림 발송
      env:
        # 노꾸리 계정
        USER_A_EXCHANGE: okx
        USER_A_API_KEY: ${{ secrets.USER_A_API_KEY }}
        USER_A_SECRET: ${{ secrets.USER_A_SECRET }}
        USER_A_PASSPHRASE: ${{ secrets.USER_A_PASSPHRASE }}
        
        # 욘두루 계정[cite: 4]
        USER_B_EXCHANGE: okx
        USER_B_API_KEY: ${{ secrets.USER_B_API_KEY }}
        USER_B_SECRET: ${{ secrets.USER_B_SECRET }}
        USER_B_PASSPHRASE: ${{ secrets.USER_B_PASSPHRASE }}
        
        # 깃허브 및 텔레그램 봇[cite: 4]
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: |
        python fetch_both.py
        sleep 60
        python send_alert.py